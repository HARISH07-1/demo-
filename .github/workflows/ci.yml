name : ci pipeline
on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t demo-1 .
      - name: Run and test Docker image
        run: |
          docker run -d --name demo-1 -p 8083:80 demo-1
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8083/
         
      