name : ci pipeline
on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t demo-1 .
      - name: Run and test Docker image
        run: |
          docker run --detach --name demo-1 --publish 8083:80 demo-1
         
      